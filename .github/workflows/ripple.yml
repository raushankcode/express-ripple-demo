name: Ripple

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  ripple:
    name: Ripple architecture gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ripple CI
        run: npx -y @getripple/cli@1.0.9 ci --base origin/${{ github.base_ref }} --github-annotations
